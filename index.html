<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Zartak Rancho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=Noto+Sans+Armenian:wght@400;500;700&family=Noto+Serif+Armenian:wght@700&family=Cormorant+Garamond:wght@700&display=swap">
<style>
/* Layout: a trail map on a phone - dark contour hero, then a route list with distance drawn to scale. Single outdoor look, high contrast for daylight. */
:root{
  --pine:#53220a; --pine2:#80380f; --paper:#f4e9dc; --card:#fffaf3; --ink:#2a1508; --muted:#6b5444;
  --marker:#f0924a; --line:#dcc6ae; --warn:#8a3b12;
  --display:'Cormorant Garamond','Noto Serif Armenian',Georgia,serif;
  --body:'Golos Text','Noto Sans Armenian',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;text-wrap:balance}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.hero{position:relative;background:var(--pine);color:var(--paper);overflow:hidden}
#topo{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;padding-block:16px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.langs{display:flex;gap:4px;justify-self:end}
.langs button{background:transparent;color:var(--paper);border:1px solid #ffffff55;padding:8px 12px;min-height:44px;cursor:pointer;font-weight:500;font-size:14px}
.langs button[aria-pressed=true]{background:var(--marker);color:var(--pine);border-color:var(--marker)}
.brand{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;text-align:center;justify-items:stretch}
.emblem{width:min(58vw,240px);height:auto;justify-self:center;display:block}
h1{font-size:18vw;line-height:.86;text-transform:uppercase;white-space:nowrap}
h1 span{display:inline-block}
h1 small{display:block;font-size:10vw;color:var(--marker);line-height:1;margin-top:.14em;text-transform:none}
h1 small span{display:inline-block}
.place{margin:0 auto;font-size:17px;max-width:32em}
.cta{display:flex;align-items:center;justify-content:center;background:var(--marker);color:var(--pine);font-weight:700;min-height:54px;padding:12px 20px;text-decoration:none;border:0;width:100%;cursor:pointer;font-size:18px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pine2)}
.tabs .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs button{background:transparent;color:var(--paper);border:0;border-bottom:4px solid transparent;min-height:56px;padding:6px 2px;font-weight:700;font-size:15px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.tabs button[aria-selected=true]{border-color:var(--marker);color:var(--marker)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pine2)}
main{padding-block:24px 8px;display:grid;gap:40px}
section{display:grid;gap:16px;min-width:0}
h2{font-size:42px}
.intro{margin:0;color:var(--muted)}
.tours{display:grid;gap:12px}
.tour{background:var(--card);padding:18px 16px;display:grid;gap:10px;border:1px solid var(--line)}
.tour header{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tour h3{font-size:32px;min-width:0}
.price{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.price span{display:block;font:400 13px/1.3 var(--body);color:var(--muted);text-align:right}
.spec{font-weight:700;margin:0;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--pine)}
.tour p.d{margin:0}
.note{margin:0;color:var(--warn);font-weight:500}
.pick{justify-self:start;background:transparent;border:2px solid var(--pine);color:var(--pine);font-weight:700;min-height:44px;padding:8px 16px;cursor:pointer}
.soon{background:var(--pine);color:var(--paper);padding:24px 16px;display:grid;gap:16px}
.soon h3{font-size:34px;color:var(--marker)}
.soon p{margin:0}
.facts{margin:0;padding:0;list-style:none;display:grid}
.facts li{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.facts b{font-weight:700}
.tbc{background:var(--marker);padding:0 6px;justify-self:start;font-size:14px;font-weight:500}
form{display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:500;min-width:0}
input:not([type=checkbox]),select{width:100%;min-width:0;min-height:50px;padding:10px 12px;border:1px solid var(--muted);background:var(--card);color:var(--ink);border-radius:0;font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:center;font-weight:400;min-height:44px}
.check input{width:22px;height:22px;flex:none}
.result{background:var(--card);border:2px solid var(--pine);padding:14px;display:grid;gap:10px}
.result p{margin:0}
.result pre{margin:0;white-space:pre-wrap;font:inherit;color:var(--muted)}
footer{padding-block:24px 32px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.tour.flash{animation:f .7s}@keyframes f{from{background:var(--marker)}}}
</style>

</head>
